syntax = "proto3";

package CHAT_PACKAGE;

service QuickReplyCategoriesService {
 
  rpc Create(CreateQuickReplyCategoriesRequest) returns (QuickReplyCategoriesResponse);
  rpc GetPaging(GetPagingQuickReplyCategoriesRequest) returns (QuickReplyCategoriesResponse);
  
}

// ===== Request =====

message CreateQuickReplyCategoriesRequest {
  string name = 1;
  string color = 2;
  string page_id = 3;
}

message GetPagingQuickReplyCategoriesRequest {
  int32 pageIndex = 1;
  int32 limit = 2;
  string search = 3;
  string page_id = 4;
}




// ===== Response chuẩn theo pattern code/message/data =====
message QuickReplyCategoriesResponse {
  int32 code = 1;
  string message = 2;
  string data = 3;
}

